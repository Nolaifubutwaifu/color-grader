[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "colorgrader"
version = "0.1.0"
description = "Match the colour of a set of video clips and export LUTs for DaVinci Resolve and Premiere Pro"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.22"]

[project.scripts]
colorgrade = "colorgrader.cli:main"

[tool.setuptools.packages.find]
include = ["colorgrader*"]
